# 规则提供者
rule-providers:
  # 个人规则
  personal-direct: { <<: *class, url: 'https://gh-proxy.com/github.com/bbenchen/clash/raw/refs/heads/main/list/DIRECT.list'}
  personal-reject: { <<: *class, url: 'https://gh-proxy.com/github.com/bbenchen/clash/raw/refs/heads/main/list/REJECT.list'}

  # 广告
  banad: { <<: *class, url: 'https://gh-proxy.com/github.com/ACL4SSR/ACL4SSR/raw/refs/heads/master/Clash/BanAD.list'}
  category-ads: { <<: *domain, url: 'https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ads.mrs' }

  # 域名规则
  domain-private: { <<: *domain, url: 'https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/private.mrs' }
  domain-speedtest-cn: { <<: *domain, url: 'https://gh-proxy.com/github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-speedtest@cn.mrs' }
